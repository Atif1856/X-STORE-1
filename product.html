<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | X STORE</title>

  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="motion.css?v=2">
  
  <link rel="stylesheet" href="theme.css?v=1">

  <style>
    .product-page{max-width:1240px;margin:38px auto;padding:24px clamp(18px,4vw,55px);display:grid;grid-template-columns:1.08fr .92fr;gap:clamp(28px,5vw,75px);align-items:start}
    .product-page>div:first-child{position:static}
    .product-page>div:first-child img{width:78%;max-width:468px;max-height:560px;aspect-ratio:4/5;object-fit:contain;border-radius:0;background:#e9e6dc;display:block;margin:0 auto}
    .product-details{padding:22px 0;max-width:520px}
    .product-details>p:first-child{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:#26352B;font-weight:700}
    .product-details h1{font-family:'Playfair Display',serif;font-size:clamp(2.3rem,4vw,3.7rem);font-weight:500;line-height:1.08;letter-spacing:-.035em}
    .product-price{font-size:1.35rem;font-weight:600;letter-spacing:.02em}
    .product-current-price{display:inline-block;color:#26352B;font-size:1.55rem;font-weight:800;letter-spacing:.01em}
    .product-price:has(.product-sale-badge){display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .product-old-price{display:inline-block;text-decoration:line-through!important;color:#85877f!important;font-size:1rem!important;font-weight:500;margin:0 2px!important}
    .product-sale-badge{display:inline-flex;align-items:center;background:#26352B;color:#EEF0E7;padding:6px 9px;font-size:.68rem;font-weight:800;letter-spacing:.06em;border-radius:2px;white-space:nowrap}
    .product-description{color:#69665e;font-size:.92rem;line-height:1.9}
    .product-stock{font-size:.78rem;color:#45634e}
    .product-page .product-actions button{border-radius:0;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem;min-height:50px}
    .product-page button{background:#171717;color:#f1f0e8;border:1px solid #171717;padding:14px 25px}
    .product-page .buy-now-btn{background:#26352B;color:#171717;border-color:#26352B}
    #product-size{border-radius:0;background:#f8f7f2;border-color:#c9c2b5;max-width:100%}
    .product-page .product-details>p:last-child{margin-top:28px;font-size:.78rem;text-transform:uppercase;letter-spacing:.07em}
    .product-page .product-details>p:last-child a{border-bottom:1px solid #26352B;padding-bottom:4px}
    @media(max-width:760px){
      body:has(.product-page){padding-bottom:104px}
      .product-page .product-actions{
        position:fixed;left:0;right:0;bottom:0;z-index:900;
        display:grid;grid-template-columns:1.15fr .85fr;gap:8px;
        padding:12px max(14px,env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));
        margin:0;background:rgba(238,240,231,.97);backdrop-filter:blur(12px);
        border-top:1px solid rgba(38,53,43,.16);box-shadow:0 -8px 28px rgba(23,23,23,.10)
      }
      .product-page .product-actions button{width:100%;min-height:48px;margin:0}
      .product-page .product-actions #add-product-cart{background:#26352B;color:#EEF0E7;border-color:#26352B}
      .product-page .product-actions #buy-now{background:#fff;color:#26352B;border-color:#26352B}
    }
    .reviews-section{grid-column:1/-1;max-width:900px;width:100%;margin:34px auto 70px;padding:28px;background:#f7f7f1;border:1px solid #d9ddcf}
    .reviews-section h2{font-family:'Playfair Display',serif;font-size:2rem;color:#26352B}
    .review-summary{color:#687267;margin:8px 0 20px}
    .review-list{display:grid;gap:14px;margin:20px 0}
    .review-card{padding:16px;background:#fff;border:1px solid #e2e5dc}
    .review-stars{color:#8a7b38;letter-spacing:2px}
    .review-form{display:grid;gap:12px;max-width:600px;margin-top:22px}
    .review-form input,.review-form textarea,.review-form select{width:100%;padding:12px;border:1px solid #cbd1c4;background:#fff;color:#26352B}
    .review-form button{background:#26352B;color:#EEF0E7;padding:13px 18px;border:0;cursor:pointer}
    #review-message{font-size:.9rem;color:#526B50}
\n    .product-benefits{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0;padding:18px 0;border-top:1px solid #dedbd1;border-bottom:1px solid #dedbd1}
    .product-benefits span{font-size:.72rem;color:#6b6861}
    .product-benefits strong{display:block;color:#171717;font-size:.75rem;margin-bottom:4px}

    .product-page img {
      width: 100%;
      border-radius: 12px;
      object-fit: contain;
      background: #f1f0e8;
    }

    .product-details {
      padding: 15px 0;
    }

    .product-details h1 {
      font-size: 32px;
      margin: 12px 0;
    }

    .product-price {
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0;
    }

    .product-old-price {
      text-decoration: line-through;
      color: #888;
      font-size: 17px;
      margin-left: 8px;
    }

    .product-description {
      line-height: 1.8;
      margin: 20px 0;
      white-space: pre-line;
    }

    .product-stock {
      margin: 15px 0;
    }

    .size-section {
      margin: 22px 0;
    }

    .size-section label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    #product-size {
      width: 100%;
      max-width: 280px;
      padding: 13px;
      border: 1px solid #b9ad91;
      border-radius: 6px;
      background: #f1f0e8;
      color: #111;
      font-size: 15px;
    }

    .product-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .product-page button {
      background: #171717;
      color: #f1f0e8;
      border: 1px solid #26352B;
      padding: 14px 25px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: .25s ease;
    }

    .product-page button:hover:not(:disabled) {
      background: #26352B;
      color: #111;
    }

    .product-page button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .product-page .buy-now-btn {
      background: #26352B;
      color: #111;
    }

    .product-page .buy-now-btn:hover:not(:disabled) {
      background: #171717;
      color: #f1f0e8;
    }

    #product-message {
      margin-top: 15px;
      min-height: 20px;
    }

    @media(max-width:700px) {
      .product-page>div:first-child{position:static}
      .product-page{padding:12px 18px}
      .product-page {
        grid-template-columns: 1fr;
        gap: 20px;
        margin: 20px auto;
      }

      .product-details h1 {
        font-size: 25px;
      }

      .product-actions {
        flex-direction: column;
      }

      .product-actions button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header class="site-header">
    <a class="brand" href="index.html"><img class="brand-logo" src="xstore-mark.svg" alt="X STORE"><span class="brand-word">STORE</span></a>
    <nav><a href="index.html#shop">Shop All</a><a href="index.html#categories">Categories</a><a href="about.html">Our Story</a><a href="track-order.html">Track Order</a></nav>
    <a class="cart-link" href="cart.html">Cart <span id="cart-count" class="count">0</span></a>
  </header>

  <main>
    <div id="product-container" class="product-page">
      <p>Loading product...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    (() => {
      const cfg = window.XSTORE_CONFIG || {};
      const container = document.getElementById("product-container");
      const params = new URLSearchParams(location.search);
      const productId = params.get("id");

      const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[c]);

      const money = value =>
        `${cfg.CURRENCY || "PKR"} ${Number(value || 0).toLocaleString("en-PK")}`;

      const fallback = "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700"><rect width="100%" height="100%" fill="#f1f0e8"/><text x="50%" y="50%" text-anchor="middle" fill="#26352B" font-size="50">X STORE</text></svg>'
      );

      if (!productId) {
        container.innerHTML =
          "<p>Product ID is missing. Please return to the shop.</p>";
        return;
      }

      if (
        !cfg.SUPABASE_URL ||
        !cfg.SUPABASE_ANON_KEY ||
        !window.supabase
      ) {
        container.innerHTML =
          "<p>Supabase configuration is missing.</p>";
        return;
      }

      const sb = window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_ANON_KEY
      );

      function getCart() {
        try {
          const cart = JSON.parse(
            localStorage.getItem("xstore_cart") || "[]"
          );

          return Array.isArray(cart) ? cart : [];
        } catch {
          return [];
        }
      }

      function updateCartCount() {
        const cart = getCart();

        document.getElementById("cart-count").textContent =
          cart.reduce((total, item) => {
            return total + Number(item.qty || 0);
          }, 0);
      }

      async function loadProduct() {
        const { data: p, error } = await sb
          .from("products")
          .select(`
            id,
            title,
            description,
            short_description,
            price,
            sale_price,
            sku,
            stock,
            image_url,
            image_path,
            sizes,
            is_published,
            categories(name)
          `)
          .eq("id", productId)
          .eq("is_published", true)
          .single();

        if (error || !p) {
          container.innerHTML = `
            <div>
              <h2>Product not found</h2>
              <p>This product is unavailable or may have been removed.</p>
              <a href="index.html#shop">Back to shop</a>
            </div>
          `;
          return;
        }

        const regularPrice = Number(p.price);
        const salePrice = Number(p.sale_price);
        const hasSale = Number.isFinite(salePrice) &&
          salePrice > 0 &&
          Number.isFinite(regularPrice) &&
          regularPrice > 0 &&
          salePrice < regularPrice;
        const price = hasSale ? salePrice : regularPrice;
        const discountPercent = hasSale
          ? Math.round((1 - salePrice / regularPrice) * 100)
          : 0;

        const sizes = Array.isArray(p.sizes)
          ? [...new Set(
              p.sizes
                .map(size => String(size).trim())
                .filter(Boolean)
            )]
          : [];

        let image = p.image_url || fallback;

        if (!p.image_url && p.image_path) {
          const result = sb.storage
            .from("product-images")
            .getPublicUrl(p.image_path);

          image = result.data?.publicUrl || fallback;
        }

        container.innerHTML = `
          <div>
            <img
              id="main-product-image"
              src="${esc(image)}"
              alt="${esc(p.title)}"
            >
          </div>

          <div class="product-details">
            <p>${esc(p.categories?.name || "X STORE")}</p>

            <h1>${esc(p.title)}</h1>

            <div class="product-price" aria-label="Product price">
              <span class="product-current-price">${money(price)}</span>
              ${
                hasSale
                  ? `<span class="product-old-price">${money(regularPrice)}</span>
                     <span class="product-sale-badge">-${discountPercent}% OFF</span>`
                  : ""
              }
            </div>

            <p class="product-stock">
              ${
                Number(p.stock) > 0
                  ? `In stock: ${Number(p.stock)}`
                  : "Out of stock"
              }
            </p>

            ${
              sizes.length
                ? `
                  <div class="size-section">
                    <label for="product-size">Select Size *</label>

                    <select id="product-size">
                      <option value="">Choose your size</option>
                      ${sizes.map(size =>
                        `<option value="${esc(size)}">${esc(size)}</option>`
                      ).join("")}
                    </select>
                  </div>
                `
                : ""
            }

            <div class="product-description">
              ${esc(
                p.description ||
                p.short_description ||
                "No description available."
              )}
            </div>

            <div class="product-benefits"><span><strong>Cash on Delivery</strong>Convenient payment at delivery</span><span><strong>Need assistance?</strong>Our support team is here to help</span></div>
            <div class="product-actions">
              <button
                id="add-product-cart"
                ${Number(p.stock) <= 0 ? "disabled" : ""}
              >
                Add to Cart
              </button>

              <button
                id="buy-now"
                class="buy-now-btn"
                ${Number(p.stock) <= 0 ? "disabled" : ""}
              >
                Buy Now →
              </button>
            </div>

            <p id="product-message" aria-live="polite"></p>

            <p>
              <a href="index.html#shop">← Continue shopping</a>
            </p>
          </div>
          <section class="reviews-section" aria-labelledby="reviews-title">
            <h2 id="reviews-title">Customer Reviews</h2>
            <p class="review-summary" id="review-summary">Loading customer reviews...</p>
            <div class="review-list" id="review-list"></div>
            <h3>Write a Review</h3>
            <form class="review-form" id="review-form">
              <input id="review-name" maxlength="60" placeholder="Your name" required>
              <select id="review-rating" required aria-label="Rating">
                <option value="">Select rating</option><option value="5">5 - Excellent</option><option value="4">4 - Very good</option><option value="3">3 - Good</option><option value="2">2 - Fair</option><option value="1">1 - Poor</option>
              </select>
              <textarea id="review-text" rows="4" maxlength="1000" placeholder="Share your experience" required></textarea>
              <button type="submit">Submit Review</button>
              <p id="review-message" aria-live="polite"></p>
            </form>
          </section>
        `;

        document.getElementById("main-product-image").onerror = function() {
          this.src = fallback;
        };

        // Customer reviews: new submissions stay pending until approved in Supabase.
        const reviewList=document.getElementById("review-list");
        const reviewSummary=document.getElementById("review-summary");
        const reviewForm=document.getElementById("review-form");
        const reviewMessage=document.getElementById("review-message");
        async function loadReviews(){
          const {data,error}=await sb.from("product_reviews").select("customer_name,rating,review_text,created_at").eq("product_id",p.id).eq("is_approved",true).order("created_at",{ascending:false}).limit(30);
          if(error){reviewSummary.textContent="Reviews are not available yet. Store setup is required.";reviewList.innerHTML="";return;}
          const rows=data||[];
          reviewSummary.textContent=rows.length?rows.length+" verified-public review"+(rows.length===1?"":"s"):"No reviews yet. Be the first to review this product.";
          reviewList.innerHTML=rows.map(row=>`<article class="review-card"><div class="review-stars">${"★".repeat(Math.max(0,Math.min(5,Number(row.rating))))}${"☆".repeat(5-Math.max(0,Math.min(5,Number(row.rating))))}</div><strong>${esc(row.customer_name)}</strong><p>${esc(row.review_text)}</p><small>${new Date(row.created_at).toLocaleDateString("en-PK")}</small></article>`).join("");
        }
        reviewForm.addEventListener("submit",async event=>{
          event.preventDefault();
          const submit=reviewForm.querySelector("button[type=submit]");
          submit.disabled=true;reviewMessage.textContent="Submitting...";
          const {error}=await sb.from("product_reviews").insert({product_id:p.id,customer_name:document.getElementById("review-name").value.trim(),rating:Number(document.getElementById("review-rating").value),review_text:document.getElementById("review-text").value.trim()});
          submit.disabled=false;
          if(error){console.error(error);reviewMessage.textContent="Review setup incomplete. Please try again later.";return;}
          reviewForm.reset();reviewMessage.textContent="Thanks! Your review is submitted and will appear after approval.";
        });
        loadReviews();

        // Shared cart function for Add to Cart and Buy Now.
        function addProductToCart() {
          const message = document.getElementById("product-message");
          const sizeSelect = document.getElementById("product-size");

          message.textContent = "";

          let selectedSize = null;

          if (sizes.length > 0) {
            selectedSize = sizeSelect?.value || "";

            if (!selectedSize) {
              message.textContent = "Please select a size first.";
              return false;
            }
          }

          const stock = Number(p.stock || 0);

          if (stock < 1) {
            message.textContent = "This product is out of stock.";
            return false;
          }

          const cart = getCart();

          const existing = cart.find(item =>
            item.id === p.id &&
            (item.selected_size || null) === selectedSize
          );

          // Product stock is shared across all sizes.
          const totalProductQty = cart
            .filter(item => item.id === p.id)
            .reduce((total, item) => {
              return total + Number(item.qty || 0);
            }, 0);

          if (totalProductQty + 1 > stock) {
            message.textContent = "Stock limit reached.";
            return false;
          }

          if (existing) {
            existing.qty = Number(existing.qty || 0) + 1;
          } else {
            cart.push({
              id: p.id,
              title: p.title,
              price: price,
              image_url: p.image_url,
              image_path: p.image_path,
              selected_size: selectedSize,
              qty: 1
            });
          }

          localStorage.setItem(
            "xstore_cart",
            JSON.stringify(cart)
          );

          updateCartCount();

          return true;
        }

        // Normal Add to Cart.
        document
          .getElementById("add-product-cart")
          .addEventListener("click", () => {
            const added = addProductToCart();

            if (added) {
              const selectedSize =
                document.getElementById("product-size")?.value || "";

              document.getElementById("product-message").textContent =
                selectedSize
                  ? `Product added to cart. Size: ${selectedSize}`
                  : "Product added to cart successfully.";
            }
          });

        // Buy Now: add product to existing cart, then open checkout.
        document
          .getElementById("buy-now")
          .addEventListener("click", () => {
            const added = addProductToCart();

            if (!added) return;

            window.location.href = "checkout.html";
          });
      }

      updateCartCount();
      loadProduct();
    })();
  </script>

<script defer src="motion.js?v=11"></script>
</body>
</html>
```
