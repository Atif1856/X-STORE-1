
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Order Received | X STORE</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <span class="brand-x">X</span> STORE
    </a>
  </header>

  <main class="page-wrap narrow">
    <div class="panel success-panel">
      <div class="success-mark">✓</div>

      <p class="eyebrow">ORDER RECEIVED</p>
      <h1>Thank you for your order.</h1>

      <p>Your Cash on Delivery order has been submitted.</p>

      <p id="order-number" class="order-number"></p>

      <p class="muted small">
        Save your order number for reference.
        You can use it to track your order.
      </p>

      <a class="btn btn-dark" href="track-order.html">
        Track Your Order →
      </a>

      <a class="btn" href="index.html" style="margin-top:10px">
        Continue Shopping
      </a>
    </div>
  </main>

  <script>
    const orderNumber =
      sessionStorage.getItem("xstore_last_order");

    document.getElementById("order-number").textContent =
      "Order number: " +
      (orderNumber || "Please contact the store if you did not receive a number.");
  </script>
</body>
</html>
