```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product | X STORE</title>

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="logo.css?v=2">
  <link rel="stylesheet" href="theme.css?v=1">

  <style>
    .product-page {
      max-width: 1100px;
      margin: 50px auto;
      padding: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 45px;
    }

    .product-page img {
      width: 100%;
      border-radius: 12px;
      object-fit: contain;
      background: #f1f0e8;
    }

    .product-details {
      padding: 15px 0;
    }

    .product-details h1 {
      font-size: 32px;
      margin: 12px 0;
    }

    .product-price {
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0;
    }

    .product-old-price {
      text-decoration: line-through;
      color: #888;
      font-size: 17px;
      margin-left: 8px;
    }

    .product-description {
      line-height: 1.8;
      margin: 20px 0;
      white-space: pre-line;
    }

    .product-stock {
      margin: 15px 0;
    }

    .size-section {
      margin: 22px 0;
    }

    .size-section label {
      display: block;

      margin-bottom: 10px;
    }

    #product-size {
      width: 100%;
      max-width: 280px;
      padding: 13px;
      border: 1px solid #b9ad91;
      border-radius: 6px;
      background: #f1f0e8;
      color: #111;
      font-size: 15px;
    }

    .product-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .product-page button {
      background: #171717;
      color: #f1f0e8;
      border: 1px solid #b89b62;
      padding: 14px 25px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: .25s ease;
    }

    .product-page button:hover:not(:disabled) {
      background: #b89b62;
      color: #111;
    }

    .product-page button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .product-page .buy-now-btn {
      background: #b89b62;

        grid-template-columns: 1fr;

  </style>
</head>

<body>

  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">X STORE</a>
      <a href="cart.html">Cart (<span id="cart-count">0</span>)</a>
    </div>
  </header>

  <main>
    <div id="product-container" class="product-page">
      <p>Loading product...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>

  <script>
    (() => {
      const cfg = window.XSTORE_CONFIG || {};
      const container = document.getElementById("product-container");
      const params = new URLSearchParams(location.search);
      const productId = params.get("id");

      const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[c]);

      const money = value =>
        `${cfg.CURRENCY || "PKR"} ${Number(value || 0).toLocaleString("en-PK")}`;

      const fallback = "data:image/svg+xml," + encodeURIComponent(
        '<svg xmlns="http://www.w3.org/2000/svg" width="600" height="700"><rect width="100%" height="100%" fill="#f1f0e8"/><text x="50%" y="50%" text-anchor="middle" fill="#b89b62" font-size="50">X STORE</text></svg>'
      );

      if (!productId) {
        container.innerHTML =
          "<p>Product ID is missing. Please return to the shop.</p>";
        return;
      }

      if (
        !cfg.SUPABASE_URL ||
        !cfg.SUPABASE_ANON_KEY ||
        !window.supabase
      ) {
        container.innerHTML =
          "<p>Supabase configuration is missing.</p>";
        return;
      }

      const sb = window.supabase.createClient(
        cfg.SUPABASE_URL,
        cfg.SUPABASE_ANON_KEY
      );

      function getCart() {
        try {
          const cart = JSON.parse(
            localStorage.getItem("xstore_cart") || "[]"
          );

          return Array.isArray(cart) ? cart : [];
        } catch {
          return [];
        }
      }

      function updateCartCount() {
        const cart = getCart();

        document.getElementById("cart-count").textContent =
          cart.reduce((total, item) => {
            return total + Number(item.qty || 0);
          }, 0);
      }

      async function loadProduct() {
        const { data: p, error } = await sb
          .from("products")
          .select(`
            id,
            title,
            description,
            short_description,
            price,
            sale_price,
            sku,
            stock,
            image_url,
            image_path,
            sizes,
            is_published,
            categories(name)
          `)
          .eq("id", productId)
          .eq("is_published", true)
          .single();

        if (error || !p) {
          container.innerHTML = `
            <div>
              <h2>Product not found</h2>
              <p>This product is unavailable or may have been removed.</p>
              <a href="index.html#shop">Back to shop</a>
            </div>
          `;
          return;
        }

        const price = Number(
          p.sale_price > 0 && p.sale_price < p.price
            ? p.sale_price
            : p.price
        );

        const sizes = Array.isArray(p.sizes)
          ? [...new Set(
              p.sizes
                .map(size => String(size).trim())
                .filter(Boolean)
            )]
          : [];

        let image = p.image_url || fallback;

        if (!p.image_url && p.image_path) {
          const result = sb.storage
            .from("product-images")
            .getPublicUrl(p.image_path);

          image = result.data?.publicUrl || fallback;
        }

        container.innerHTML = `
          <div>
            <img
              id="main-product-image"
              src="${esc(image)}"
              alt="${esc(p.title)}"
            >
          </div>

          <div class="product-details">
            <p>${esc(p.categories?.name || "X STORE")}</p>

            <h1>${esc(p.title)}</h1>

            <div class="product-price">
              ${money(price)}

              ${
                Number(p.sale_price) > 0 &&
                Number(p.sale_price) < Number(p.price)
                  ? `<span class="product-old-price">${money(p.price)}</span>`
                  : ""
              }
            </div>

            <p class="product-stock">
              ${
                Number(p.stock) > 0
                  ? `In stock: ${Number(p.stock)}`
                  : "Out of stock"
              }
            </p>

            ${
              sizes.length
                ? `
                  <div class="size-section">
                    <label for="product-size">Select Size *</label>

                    <select id="product-size">
                      <option value="">Choose your size</option>
                      ${sizes.map(size =>
                        `<option value="${esc(size)}">${esc(size)}</option>`
                      ).join("")}
                    </select>
                  </div>
                `
                : ""
            }

            <div class="product-description">
              ${esc(
                p.description ||
                p.short_description ||
                "No description available."
              )}
            </div>

            <div class="product-actions">
              <button
                id="add-product-cart"
                ${Number(p.stock) <= 0 ? "disabled" : ""}
              >
                Add to Cart
              </button>

              <button
                id="buy-now"
                class="buy-now-btn"
                ${Number(p.stock) <= 0 ? "disabled" : ""}
              >
                Buy Now →
              </button>
            </div>

            <p id="product-message" aria-live="polite"></p>

            <p>
              <a href="index.html#shop">← Continue shopping</a>
            </p>
          </div>
        `;

        document.getElementById("main-product-image").onerror = function() {
          this.src = fallback;
        };

        // Shared cart function for Add to Cart and Buy Now.
        function addProductToCart() {
          const message = document.getElementById("product-message");
          const sizeSelect = document.getElementById("product-size");

          message.textContent = "";

          let selectedSize = null;

          if (sizes.length > 0) {
            selectedSize = sizeSelect?.value || "";

            if (!selectedSize) {
              message.textContent = "Please select a size first.";
              return false;
            }
          }

          const stock = Number(p.stock || 0);

          if (stock < 1) {
            message.textContent = "This product is out of stock.";
            return false;
          }

          const cart = getCart();

          const existing = cart.find(item =>
            item.id === p.id &&
            (item.selected_size || null) === selectedSize
          );

          // Product stock is shared across all sizes.
          const totalProductQty = cart
            .filter(item => item.id === p.id)
            .reduce((total, item) => {
              return total + Number(item.qty || 0);
            }, 0);

          if (totalProductQty + 1 > stock) {
            message.textContent = "Stock limit reached.";
            return false;
          }

          if (existing) {
            existing.qty = Number(existing.qty || 0) + 1;
          } else {
            cart.push({
              id: p.id,
              title: p.title,
              price: price,
              image_url: p.image_url,
              image_path: p.image_path,
              selected_size: selectedSize,
              qty: 1
            });
          }

          localStorage.setItem(
            "xstore_cart",
            JSON.stringify(cart)
          );

          updateCartCount();

          return true;
        }

        // Normal Add to Cart.
        document
          .getElementById("add-product-cart")
          .addEventListener("click", () => {
            const added = addProductToCart();

            if (added) {
              const selectedSize =
                document.getElementById("product-size")?.value || "";

              document.getElementById("product-message").textContent =
                selectedSize
                  ? `Product added to cart. Size: ${selectedSize}`
                  : "Product added to cart successfully.";
            }
          });

        // Buy Now: add product to existing cart, then open checkout.
        document
          .getElementById("buy-now")
          .addEventListener("click", () => {
            const added = addProductToCart();

            if (!added) return;

            window.location.href = "checkout.html";
          });
      }

      updateCartCount();
      loadProduct();
    })();
  </script>

</body>
</html>
