<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Returns | X STORE</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="theme.css?v=1"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="returns.js?v=1"></script></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-word">X STORE</span></a><nav><a href="index.html">Shop</a><a href="track-order.html">Track Order</a><a href="policy.html">Policy</a></nav></header><main class="section" style="max-width:720px;margin:40px auto;padding:24px"><p class="eyebrow">CUSTOMER CARE</p><h1>Return request</h1><p>Request a return within 7 calendar days of delivery for damaged, defective or wrong items only. Read the <a href="policy.html">return policy</a>.</p><label>Email used for your order</label><input id="email" type="email" autocomplete="email" style="display:block;width:100%;padding:12px;margin:8px 0"><button id="send-code" class="btn btn-dark" type="button">Send email verification link</button><p id="status" role="status"></p><section id="request-form" hidden><h2>Return details</h2><label>Order number</label><input id="order-number" style="display:block;width:100%;padding:12px;margin:8px 0"><label>Reason</label><select id="reason" style="display:block;width:100%;padding:12px;margin:8px 0"><option value="damaged">Damaged</option><option value="defective">Defective</option><option value="wrong_item">Wrong item</option></select><label>Description</label><textarea id="description" minlength="10" maxlength="2000" rows="4" style="display:block;width:100%;padding:12px;margin:8px 0"></textarea><label>Order item ID</label><input id="item-id" style="display:block;width:100%;padding:12px;margin:8px 0"><label>Quantity</label><input id="quantity" type="number" min="1" value="1" style="display:block;width:100%;padding:12px;margin:8px 0"><button id="submit" class="btn btn-dark" type="button">Submit request</button></section></main><footer><a href="policy.html">Policies</a></footer></body></html>
