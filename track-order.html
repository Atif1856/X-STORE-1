
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Your Order | X STORE</title>

  <link rel="stylesheet" href="style.css"><link rel="stylesheet" href="motion.css?v=2">

  <style>
    .tracking-wrap {
      max-width: 650px;
      margin: 55px auto;
      padding: 20px;
    }

    .tracking-card {
      background: #f1f0e8;
      padding: 30px;
      border-radius: 18px;
      border: 1px solid #ddd;
    }

    .tracking-card h1 {
      margin-bottom: 10px;
    }

    .tracking-form {
      display: grid;
      gap: 15px;
      margin-top: 25px;
    }

    .tracking-form input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
    }

    .tracking-form button {
      padding: 14px;
      background: #d93333;
      color: white;
      border: 0;
      border-radius: 9px;
      font-weight: bold;
      cursor: pointer;
    }

    .tracking-result {
      margin-top: 25px;
    }

    .tracking-status {
      background: white;
      border-left: 5px solid #d93333;
      padding: 17px;
      border-radius: 9px;
      margin-bottom: 15px;
    }

    .tracking-history {
      display: grid;
      gap: 12px;
      margin-top: 20px;
    }

    .history-item {
      background: white;
      padding: 14px;
      border-radius: 9px;
      border-left: 3px solid #d93333;
    }

    .history-item small {
      display: block;
      color: #777;
      margin-top: 5px;
    }

    .tracking-error {
      color: #c62828;
      margin-top: 15px;
    }

    .tracking-muted { color:#687267; font-size:13px; }
    .tracking-status{background:#F4F5ED;border-left:4px solid #26352B;color:#26352B}
    .tracking-status h2{margin:7px 0;color:#26352B}
    .tracking-history{position:relative;gap:0;margin:18px 0 0 7px;padding-left:25px}
    .history-item{position:relative;background:transparent;border:0;border-left:2px solid #D5DCCF;border-radius:0;padding:0 0 23px 18px;margin:0;color:#26352B}
    .history-item:last-child{border-left-color:transparent;padding-bottom:0}
    .history-item:before{content:"";position:absolute;left:-7px;top:2px;width:10px;height:10px;border-radius:50%;background:#A6A17A;border:2px solid #EEF0E7;box-shadow:0 0 0 1px #A6A17A}
    .history-item.is-current:before{background:#26352B;box-shadow:0 0 0 4px rgba(166,161,122,.25)}
    .history-item strong{display:block;font-size:14px}
    .history-item p{margin:5px 0;color:#687267;font-size:13px;line-height:1.5}
    .history-item small{color:#7B8277;font-size:12px}
    .tracking-progress{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;margin:22px 0 26px}
    .tracking-progress-step{height:4px;border-radius:5px;background:#DDE1D6}
    .tracking-progress-step.done{background:#526B50}
    .tracking-progress-label{grid-column:1/-1;display:flex;justify-content:space-between;gap:8px;color:#788174;font-size:10px;margin-top:5px}
    @media(max-width:480px){.tracking-card{padding:20px}.tracking-progress-label{font-size:9px}}
  </style>
</head>

<body>

<header class="site-header">
  <a class="brand" href="index.html">
    <span class="brand-x">X</span> STORE
  </a>
</header>

<main class="tracking-wrap">

  <section class="tracking-card">

    <p class="eyebrow">X STORE DELIVERY</p>

    <h1>Track Your Order</h1>

    <p class="tracking-muted">
      Enter your order number and registered phone number
      to check your delivery status.
    </p>

    <form id="tracking-form" class="tracking-form">

      <input
        type="text"
        id="order-number"
        placeholder="Order Number (e.g. XS-261030-ABC123)"
        required
      >

      <input
        type="tel"
        id="phone-number"
        placeholder="Registered Mobile Number"
        required
      >

      <button type="submit" id="track-btn">
        Track My Order
      </button>

    </form>

    <p id="tracking-error" class="tracking-error"></p>

    <div id="tracking-result" class="tracking-result"></div>

  </section>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>

<script>
(() => {
  "use strict";

  const cfg = window.XSTORE_CONFIG || {};

  const form = document.getElementById("tracking-form");
  const button = document.getElementById("track-btn");
  const errorBox = document.getElementById("tracking-error");
  const resultBox = document.getElementById("tracking-result");

  const configured =
    cfg.SUPABASE_URL &&
    cfg.SUPABASE_ANON_KEY &&
    window.supabase;

  if (!configured) {
    errorBox.textContent = "Store connection is not configured.";
    button.disabled = true;
    return;
  }

  const db = window.supabase.createClient(
    cfg.SUPABASE_URL,
    cfg.SUPABASE_ANON_KEY
  );

  const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  }[c]));

  const formatDate = value => {
    const date = new Date(value);

    if (Number.isNaN(date.getTime())) return "Date unavailable";

    return date.toLocaleString("en-PK", {
      dateStyle: "medium",
      timeStyle: "short",
      timeZone: "Asia/Karachi"
    });
  };

  const statusNames = {
    pending_confirmation: "Order Placed",
    confirmed: "Confirmed",
    processing: "Processing",
    shipped: "Shipped",
    out_for_delivery: "Out for Delivery",
    delivered: "Delivered",
    cancelled: "Cancelled",
    returned: "Returned"
  };

  form.addEventListener("submit", async event => {
    event.preventDefault();

    errorBox.textContent = "";
    resultBox.innerHTML = "";

    const orderNumber =
      document.getElementById("order-number").value.trim();

    const phone =
      document.getElementById("phone-number").value.trim();

    if (!orderNumber || !phone) {
      errorBox.textContent = "Please enter both details.";
      return;
    }

    button.disabled = true;
    button.textContent = "Checking Order...";

    try {
      const { data, error } = await db.rpc("track_xstore_order", {
        p_order_number: orderNumber,
        p_phone: phone
      });

      if (error) throw error;

      if (!data || !data.success) {
        errorBox.textContent =
          data?.message || "Order not found.";
        return;
      }

      const status =
        statusNames[data.status] || data.status;

      const history = Array.isArray(data.history)
        ? data.history
        : [];

      const progressSteps=["pending_confirmation","confirmed","processing","shipped","out_for_delivery","delivered"];
      const terminal=["cancelled","returned"].includes(data.status);
      const currentStep=progressSteps.indexOf(data.status);
      const progressBox=document.getElementById("tracking-progress");
      const completedCount=terminal?0:(currentStep<0?0:currentStep+1);
      progressBox.innerHTML=terminal
        ? `<div class="tracking-progress-label"><span>${esc(statusNames[data.status]||data.status)}</span><span>Order closed</span></div>`
        : progressSteps.slice(0,5).map((step,index)=>`<span class="tracking-progress-step ${index<Math.min(completedCount,5)?"done":""}"></span>`).join("")+
          `<div class="tracking-progress-label"><span>Placed</span><span>Confirmed</span><span>Processing</span><span>Shipped</span><span>Delivered</span></div>`;

      resultBox.innerHTML = `
        <div class="tracking-status">
          <p class="tracking-muted">ORDER NUMBER</p>
          <strong>${esc(data.order_number)}</strong>

          <p class="tracking-muted" style="margin-top:15px">
            CURRENT ORDER STATUS
          </p>

          <h2>${esc(status)}</h2>

          <p class="tracking-muted">
            Last updated: ${esc(formatDate(data.updated_at))}
          </p>
        </div>

        <h3>Order Timeline</h3>
        <div class="tracking-progress" id="tracking-progress"></div>
        <div class="tracking-history">
          ${history.length ? [...history].sort((a,b)=>new Date(a.date)-new Date(b.date)).map((item,index,items) => `
            <div class="history-item ${index===items.length-1?"is-current":""}">
              <strong>${esc(statusNames[item.status] || item.status)}</strong>
              ${item.note ? `<p>${esc(item.note)}</p>` : ""}
              <small>${esc(formatDate(item.date))}</small>
            </div>
          `).join("") : `
            <p class="tracking-muted">Order timeline will appear when a status update is recorded.</p>
          `}
        </div>
      `;

    } catch (error) {
      console.error("Tracking error:", error);

      errorBox.textContent =
        "Could not check your order. Please try again.";
    } finally {
      button.disabled = false;
      button.textContent = "Track My Order";
    }
  });

})();
</script>

<script defer src="motion.js?v=9"></script>
</body>
</html>
