<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | X STORE</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="config.js"></script><script defer src="app.js"></script></head>
<body><header class="site-header"><a class="brand" href="index.html"><span class="brand-x">X</span> STORE</a><a href="cart.html">Back to cart</a></header><main class="page-wrap narrow"><p class="eyebrow">ALMOST THERE</p><h1>Checkout</h1><div class="panel"><form id="checkout-form" class="form-grid"><label>Full name<input name="full_name" required maxlength="120" autocomplete="name"></label><label>Phone number<input name="phone" required maxlength="30" autocomplete="tel" placeholder="03XXXXXXXXX"></label><label class="full">Email (optional)<input name="email" type="email" maxlength="180" autocomplete="email"></label><label class="full">Full delivery address<textarea name="address" required maxlength="500" rows="3" autocomplete="street-address"></textarea></label><label>City<input name="city" required maxlength="100" value="Karachi" autocomplete="address-level2"></label><label>Province<input name="province" required maxlength="100" value="Sindh" autocomplete="address-level1"></label><label class="full">Delivery instructions (optional)<textarea name="instructions" maxlength="300" rows="2"></textarea></label><div class="full payment-choice"><strong>Payment method</strong><p>Cash on Delivery (COD)</p><small>Pay the delivery person when your order arrives.</small></div><div id="checkout-total" class="full total-line"></div><button class="btn btn-dark full" type="submit">Place COD order</button></form><p class="small muted">Your order will be sent to X STORE. Please check your phone number and delivery address.</p></div></main><footer><a class="brand" href="index.html"><span class="brand-x">X</span> STORE</a><p>© X STORE</p></footer><div id="toast" class="toast" role="status"></div></body></html>
